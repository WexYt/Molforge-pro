<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WEX MolForge Pro</title>
<script src="https://3Dmol.org/build/3Dmol-min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://unpkg.com/@kekule/kekule/dist/kekule.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/@kekule/kekule/dist/kekule.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#050505;color:#fff;font-family:system-ui,sans-serif;padding:18px;max-width:1200px;margin:auto}
h1{margin:0;font-size:28px}.sub{opacity:.6;font-size:12px;margin-bottom:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;align-items:center}
input,select{padding:10px;border-radius:8px;border:0;color:#000;max-width:100%}
input{width:220px}
button{padding:10px 14px;border-radius:8px;border:0;font-weight:700;cursor:pointer}
.b1{background:#fff;color:#000}.b2{background:#1a1a1a;color:#fff;border:1px solid #333}.b3{background:#0ea5e9;color:#fff}
#editor{width:100%;height:380px;background:#fff;border-radius:12px;overflow:hidden}
#viewer{width:100%;height:500px;border:1px solid #222;border-radius:14px;margin-top:12px;position:relative}
pre{background:#111;padding:10px;border-radius:10px;font-size:11px;overflow:auto;max-height:180px;white-space:pre-wrap}
.lbl{font-size:12px;opacity:.7}
</style>
</head>
<body>
<h1>WEX MolForge Pro</h1>
<div class="sub">WEX Labs · MIT · Datos: PubChem (NIH, dominio público) y RCSB PDB · <span id="count"></span> moléculas en la biblioteca</div>

<div class="bar">
  <input id="q" list="names" value="aspirin" placeholder="Nombre en PubChem…">
  <datalist id="names"></datalist>
  <button class="b1" onclick="loadPubChem()">Cargar PubChem</button>
  <select id="cat" onchange="fillMols()"></select>
  <select id="mol" onchange="pick()"></select>
  <button class="b2" onclick="randomMol()">🎲 Aleatoria</button>
</div>

<div class="bar">
  <input id="pdb" placeholder="ID PDB (1CRN, 4HHB…)" style="width:170px">
  <button class="b2" onclick="loadPDB()">Cargar PDB</button>
  <span class="lbl">Estilo:</span>
  <select id="style" onchange="restyle()">
    <option value="bs">Bolas y barras</option><option value="stick">Barras</option>
    <option value="sphere">Esferas</option><option value="line">Líneas</option>
  </select>
  <button class="b2" onclick="toggleSpin()">⟳ Girar</button>
</div>

<div class="bar">
  <button class="b2" onclick="convertEditorTo3D()">Editor 2D → 3D</button>
  <button class="b2" onclick="download('sdf')">.SDF</button>
  <button class="b2" onclick="download('mol')">.MOL</button>
  <button class="b2" onclick="download('pdb')">.PDB</button>
  <button class="b3" onclick="downloadZip()">ZIP WEX</button>
</div>

<div id="editor"></div>
<div id="viewer"></div>
<pre id="info">WEX listo. Dibuja arriba o busca una molécula.</pre>

<script src="molecules.js"></script>
<script>
let composer, viewer, spinning=false;
let cur={text:"",format:"sdf",name:"wex",info:null};
const $=id=>document.getElementById(id);
const PUG="https://pubchem.ncbi.nlm.nih.gov/rest/pug";

window.onload=function(){
  composer=new Kekule.Editor.Composer($('editor'));
  composer.setPredefinedSetting('molOnly');
  initLibrary();
  loadPubChem();
};

function initLibrary(){
  let total=0,all=new Set();
  $('cat').innerHTML=Object.keys(WEX_LIBRARY).map(c=>`<option>${c}</option>`).join('');
  Object.values(WEX_LIBRARY).forEach(a=>a.forEach(n=>all.add(n)));
  total=all.size; $('count').textContent=total+"+";
  $('names').innerHTML=[...all].map(n=>`<option value="${n}">`).join('');
  fillMols();
}
function fillMols(){
  $('mol').innerHTML=WEX_LIBRARY[$('cat').value].map(n=>`<option>${n}</option>`).join('');
}
function pick(){ $('q').value=$('mol').value; loadPubChem(); }
function randomMol(){
  const cats=Object.keys(WEX_LIBRARY), c=cats[Math.random()*cats.length|0];
  const a=WEX_LIBRARY[c]; $('q').value=a[Math.random()*a.length|0]; loadPubChem();
}

async function getJSON(u,opt){const r=await fetch(u,opt); if(!r.ok) throw new Error("HTTP "+r.status); return r.json();}
async function getText(u){const r=await fetch(u); if(!r.ok) throw new Error("HTTP "+r.status); return r.text();}

async function loadPubChem(){
  const q=$('q').value.trim(); if(!q) return;
  $('info').textContent="Buscando "+q+" en PubChem…";
  try{
    const cid=(await getJSON(`${PUG}/compound/name/${encodeURIComponent(q)}/cids/JSON`)).IdentifierList.CID[0];
    let sdf, dim="3D";
    try{ sdf=await getText(`${PUG}/compound/cid/${cid}/SDF?record_type=3d`); }
    catch(e){ sdf=await getText(`${PUG}/compound/cid/${cid}/SDF`); dim="2D (PubChem no tiene 3D)"; }
    const prop=(await getJSON(`${PUG}/compound/cid/${cid}/property/MolecularFormula,MolecularWeight,IUPACName,CanonicalSMILES/JSON`)).PropertyTable.Properties[0];
    cur={text:sdf,format:"sdf",name:q.replace(/[^\w-]+/g,'_'),info:{cid,query:q,dimension:dim,...prop}};
    $('info').textContent=JSON.stringify(cur.info,null,2);
    try{ composer.setChemObj(Kekule.IO.loadFormatData(sdf,'sdf')); }catch(e){}
    render(sdf,'sdf');
  }catch(e){ $('info').textContent="Error: "+e.message+". Prueba otro nombre en inglés (aspirin, caffeine…)."; }
}

async function loadPDB(){
  const id=$('pdb').value.trim().toUpperCase(); if(!id) return;
  $('info').textContent="Descargando "+id+" de RCSB PDB…";
  try{
    const txt=await getText(`https://files.rcsb.org/download/${id}.pdb`);
    cur={text:txt,format:"pdb",name:id,info:{pdb:id,source:"RCSB PDB"}};
    $('info').textContent=txt.split("\n").filter(l=>/^(HEADER|TITLE|COMPND)/.test(l)).slice(0,8).join("\n");
    render(txt,'pdb');
  }catch(e){ $('info').textContent="Error PDB: "+e.message; }
}

function applyStyle(){
  if(cur.format==='pdb'){
    viewer.setStyle({},{cartoon:{color:'spectrum'}});
    viewer.addStyle({hetflag:true},{stick:{}});
    return;
  }
  const s=$('style').value;
  const m={bs:{stick:{radius:.14},sphere:{scale:.24}},stick:{stick:{}},sphere:{sphere:{}},line:{line:{}}};
  viewer.setStyle({},m[s]);
}
function render(data,fmt){
  const el=$('viewer'); el.innerHTML="";
  viewer=$3Dmol.createViewer(el,{backgroundColor:'#0a0a0a'});
  viewer.addModel(data,fmt); applyStyle();
  viewer.zoomTo(); viewer.render(); if(spinning) viewer.spin(true);
}
function restyle(){ if(viewer){applyStyle();viewer.render();} }
function toggleSpin(){ spinning=!spinning; if(viewer) viewer.spin(spinning); }

async function convertEditorTo3D(){
  try{
    const mol=composer.getChemObj();
    const sdf2d=Kekule.IO.saveFormatData(mol,'sdf');
    let smi=null; try{ smi=Kekule.IO.saveFormatData(mol,'smi').trim(); }catch(e){}
    let sdf=sdf2d, note="Vista 2D plana (no se encontró versión 3D).";
    if(smi){
      try{
        const body=new URLSearchParams({smiles:smi});
        const cid=(await getJSON(`${PUG}/compound/smiles/cids/JSON`,{method:'POST',body})).IdentifierList.CID[0];
        if(cid>0){ sdf=await getText(`${PUG}/compound/cid/${cid}/SDF?record_type=3d`); note="Geometría 3D de PubChem CID "+cid; }
      }catch(e){}
    }
    cur={text:sdf,format:"sdf",name:"wex-custom",info:{source:"WEX Editor",smiles:smi}};
    $('info').textContent=note+"\n"+JSON.stringify(cur.info,null,2);
    render(sdf,'sdf');
  }catch(e){ alert("Dibuja algo primero"); }
}

function downloadFile(c,f){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/plain'}));a.download=f;a.click();}
function download(type){
  if(!cur.text) return alert("Carga o dibuja primero");
  if(type==='pdb'){ if(cur.format!=='pdb') return alert("Solo disponible para estructuras cargadas desde PDB"); return downloadFile(cur.text,cur.name+".pdb"); }
  if(cur.format==='pdb') return alert("Esta es una estructura PDB; usa .PDB");
  if(type==='sdf') downloadFile(cur.text,cur.name+".sdf");
  if(type==='mol'){ const i=cur.text.indexOf("M  END"); downloadFile(i>0?cur.text.slice(0,i+6)+"\n":cur.text,cur.name+".mol"); }
}
async function downloadZip(){
  if(!cur.text) return alert("Carga o dibuja primero");
  const zip=new JSZip(); zip.file("README.md","WEX MolForge Pro - WEX Labs - MIT");
  zip.file(`molecules/${cur.name}.${cur.format}`,cur.text);
  zip.file(`molecules/${cur.name}.json`,JSON.stringify(cur.info,null,2));
  const a=document.createElement('a'); a.href=URL.createObjectURL(await zip.generateAsync({type:"blob"})); a.download=`wex-molforge-${cur.name}.zip`; a.click();
}
</script>
</body>
</html>
